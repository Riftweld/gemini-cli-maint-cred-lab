name: sched-shape
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  sched:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      GEMINI_API_KEY: DUMMY_MC_KEY
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
      WIF_PROJECT_NUMBER: '40714870083'
      WIF_POOL: 'w2-wif-mc-p001'
      WIF_PROVIDER: 'gh-mc'
      WIF_SA: 'automation-service@riftweldproject.iam.gserviceaccount.com'
      MC_NONCE: 'w2mc-2026-10-14'
      MC_TRIGGER: 'scheduled'
    steps:
      - name: checkout default branch (no attacker content path)
        uses: actions/checkout@v4
      - name: WIF auth (same victim shape)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: projects/40714870083/locations/global/workloadIdentityPools/w2-wif-mc-p001/providers/gh-mc
          service_account: automation-service@riftweldproject.iam.gserviceaccount.com
          create_credentials_file: true
          cleanup_credentials: false
      - name: gemini startup run (no workspace config present)
        run: |
          set +e
          mkdir -p evidence
          npm install -g @google/gemini-cli@0.63.0 >/dev/null 2>&1
          timeout 240 gemini -p 'say hi' --debug > evidence/gemini.log 2>&1
          echo "gemini_exit_code=$?" | tee -a evidence/gemini.log
          cp -r /tmp/mc evidence/mc 2>/dev/null || true
      - name: workflow-owned credential-attach probe (proves cell credential status)
        run: |
          set +e
          python3 lab/probe_mint.py sched >> evidence/probe.log 2>&1
          cp -r /tmp/mc evidence/mc 2>/dev/null || true
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'sched-shape__${{ github.run_id }}'
          path: evidence/
