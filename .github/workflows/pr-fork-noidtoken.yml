name: pr-fork-noidtoken
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  attack-noidtoken:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      GEMINI_API_KEY: DUMMY_MC_KEY
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
      WIF_PROJECT_NUMBER: '40714870083'
      WIF_POOL: 'w2-wif-mc-p001'
      WIF_PROVIDER: 'gh-mc'
      WIF_SA: 'automation-service@riftweldproject.iam.gserviceaccount.com'
      MC_NONCE: 'w2mc-2026-10-14'
      MC_TRIGGER: 'fork-pr-noidtoken'
    steps:
      - name: checkout fork PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: 'gemini startup run (no id-token write in this workflow)'
        run: |
          set +e
          mkdir -p evidence
          { command -v gcloud || echo NO-GCLOUD; } > evidence/tooling.txt
          npm install -g @google/gemini-cli@0.63.0 >/dev/null 2>&1
          timeout 240 gemini -p 'say hi' --debug > evidence/gemini.log 2>&1
          echo "gemini_exit_code=$?" | tee -a evidence/gemini.log
          cp -r /tmp/mc evidence/mc 2>/dev/null || true
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'pr-fork-noidtoken__${{ github.run_id }}'
          path: evidence/
