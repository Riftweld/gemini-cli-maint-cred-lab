name: maint-dispatch
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@mc-lab /review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - id: gate
        run: |
          echo "comment_author_association=${{ github.event.comment.author_association }}"
          echo "comment_author=${{ github.event.comment.user.login }}"
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
  review:
    needs: dispatch
    uses: ./.github/workflows/maint-callable.yml
    with:
      pr: ${{ needs.dispatch.outputs.pr }}
